name: CI (offline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: windows-latest
    env:
      # Explicitly no paid credentials in CI.
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Validate knowledge (offline fixture)
        run: python scripts/validate_knowledge.py --scope offline-fixture --strict

      - name: Unit and integration tests
        run: python -m pytest tests -q

      - name: Refuse tracked secrets / runtime DBs
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '\.env$|\.sqlite|\.sqlite3$|\.db$|handoff.*\.zip$|\.venv/'
          if ($bad) {
            Write-Error "Forbidden tracked paths:`n$bad"
            exit 1
          }
          Write-Host "forbidden_files_tracked=0"
